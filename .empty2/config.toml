# Tinderbox 配置（密钥只放这里或环境变量，绝不入库）
data_dir = ""

[ingest]
max_file_mb = 5
min_chars = 20
auto_refine = true

[llm]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key = ""            # 留空则读环境变量 LLM_API_KEY
proxy = ""              # 例：http://127.0.0.1:7897

[retention]
verified_days = 180
unverified_days = 730
shrink_enabled = false

[server]
host = "127.0.0.1"
port = 8777
